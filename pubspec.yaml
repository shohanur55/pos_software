name: pos_software
description: POS file transfer module with background uploads and downloads.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  dio: ^5.11.1
  retrofit: ^4.10.0
  dart_mappable: ^4.10.0
